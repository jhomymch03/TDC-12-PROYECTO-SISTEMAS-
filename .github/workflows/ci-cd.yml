name: Portfolio CI/CD
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_test_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio_test_password@localhost:5432/portfolio
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  publish-and-deploy:
    name: Docker Hub, AWS y Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesiÃƒÆ’Ã‚Â³n en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-ci-infra:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-ci-infra:${{ github.sha }}
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Provisionar VM e DNS Cloudflare
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_key_name: ${{ vars.AWS_EC2_KEY_NAME }}
          TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_dockerhub_image: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-ci-infra:${{ github.sha }}
        run: |
          terraform init -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" -backend-config="key=portfolio/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform apply -auto-approve
          terraform output -raw public_ip > ../public_ip.txt
      - name: Instalar Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible
      - name: Configurar y desplegar con Ansible
        env:
          ANSIBLE_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-ci-infra:${{ github.sha }}
          CF_DOMAIN: ${{ vars.DOMAIN_NAME }}
          CERT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          VM_IP="$(cat public_ip.txt)"
          install -m 600 /dev/null /tmp/portfolio-key
          printf '%s\n' "$ANSIBLE_PRIVATE_KEY" > /tmp/portfolio-key
          ansible-playbook -i "$VM_IP," ansible/deploy.yml \
            --private-key /tmp/portfolio-key \
            -e "ansible_user=ubuntu docker_image=$IMAGE site_domain=$CF_DOMAIN letsencrypt_email=$CERT_EMAIL"
          rm -f /tmp/portfolio-key