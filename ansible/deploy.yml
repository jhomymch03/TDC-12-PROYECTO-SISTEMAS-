---
- name: Configurar Ubuntu 24.04 y desplegar el portafolio
  hosts: all
  become: true
  vars:
    app_dir: /opt/portfolio
    site_domain: ""
    letsencrypt_email: ""
  pre_tasks:
    - name: Esperar a que Ubuntu termine su arranque inicial
      ansible.builtin.wait_for_connection:
        delay: 20
        timeout: 600
  tasks:
    - name: Instalar paquetes base, Docker, firewall, VNC y TLS
      ansible.builtin.apt:
        name:
          - openssl
          - docker.io
          - docker-compose-v2
          - git
          - ufw
          - iptables
          - xfce4
          - tigervnc-standalone-server
          - tigervnc-common
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Habilitar Docker
      ansible.builtin.service: { name: docker, state: started, enabled: true }
    - name: Crear carpeta de despliegue
      ansible.builtin.file: { path: "{{ app_dir }}", state: directory, owner: ubuntu, group: ubuntu, mode: '0755' }
    - name: Revisar si ya existe contraseÃ±a de base de datos
      ansible.builtin.stat: { path: "{{ app_dir }}/.db_password" }
      register: db_password_file
    - name: Crear contraseÃ±a inicial de PostgreSQL en la VM
      ansible.builtin.command: "openssl rand -hex 24"
      register: generated_password
      when: not db_password_file.stat.exists
      changed_when: true
    - name: Guardar contraseÃ±a PostgreSQL en la VM
      ansible.builtin.copy:
        content: "{{ generated_password.stdout }}\n"
        dest: "{{ app_dir }}/.db_password"
        owner: root
        group: root
        mode: '0600'
      when: not db_password_file.stat.exists
    - name: Leer contraseÃ±a ya guardada
      ansible.builtin.slurp: { src: "{{ app_dir }}/.db_password" }
      register: saved_password
    - name: Instalar Compose del despliegue
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0600'
      notify: Reiniciar portafolio
    - name: Iniciar VNC solo en loopback para acceso por tÃºnel SSH
      ansible.builtin.copy:
        dest: /usr/local/bin/start-portfolio-vnc
        mode: '0755'
        content: |
          #!/bin/sh
          exec /usr/bin/tigervncserver :1 -fg -localhost yes -SecurityTypes None -geometry 1280x800 -depth 24
    - name: Configurar inicio XFCE para VNC
      ansible.builtin.copy:
        dest: /home/ubuntu/.vnc/xstartup
        owner: ubuntu
        group: ubuntu
        mode: '0700'
        content: |
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
    - name: Crear servicio systemd VNC
      ansible.builtin.copy:
        dest: /etc/systemd/system/portfolio-vnc.service
        mode: '0644'
        content: |
          [Unit]
          Description=Portfolio XFCE desktop over loopback VNC
          After=network.target
          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/local/bin/start-portfolio-vnc
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      register: vnc_unit
    - name: Recargar systemd
      ansible.builtin.systemd: { daemon_reload: true }
      when: vnc_unit.changed
    - name: Habilitar VNC
      ansible.builtin.service: { name: portfolio-vnc, state: started, enabled: true }
    - name: Permitir SSH, HTTP y HTTPS con UFW (reglas iptables)
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: [22, 80, 443]
      register: ufw_rules
      changed_when: "'Skipping adding existing rule' not in ufw_rules.stdout"
    - name: Denegar tráfico entrante por defecto
      ansible.builtin.command: ufw default deny incoming
      changed_when: false
    - name: Activar firewall
      ansible.builtin.command: ufw --force enable
      changed_when: false
    - name: Copiar configuraciÃ³n inicial Nginx HTTP para validar el dominio
      ansible.builtin.template:
        src: templates/nginx-http.conf.j2
        dest: /etc/nginx/sites-available/portfolio
        mode: '0644'
    - name: Habilitar sitio HTTP
      ansible.builtin.file:
        src: /etc/nginx/sites-available/portfolio
        dest: /etc/nginx/sites-enabled/portfolio
        state: link
    - name: Deshabilitar sitio por defecto de Nginx
      ansible.builtin.file: { path: /etc/nginx/sites-enabled/default, state: absent }
    - name: Iniciar Nginx para el desafÃ­o ACME
      ansible.builtin.service: { name: nginx, state: started, enabled: true }
    - name: Solicitar certificado Let's Encrypt
      ansible.builtin.command: >-
        certbot --nginx --non-interactive --agree-tos --redirect
        --email {{ letsencrypt_email }} -d {{ site_domain }} -d www.{{ site_domain }}
      args:
        creates: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
      when: site_domain | length > 0 and letsencrypt_email | length > 0
    - name: Instalar Nginx HTTPS
      ansible.builtin.template:
        src: templates/nginx-https.conf.j2
        dest: /etc/nginx/sites-available/portfolio
        mode: '0644'
      when: site_domain | length > 0 and letsencrypt_email | length > 0
      notify: Recargar Nginx
    - name: Asegurar que Nginx estÃ¡ activo
      ansible.builtin.service: { name: nginx, state: started, enabled: true }
    - name: Levantar servicios del portafolio
      ansible.builtin.command: docker compose up -d --pull always
      args:
        chdir: "{{ app_dir }}"
      changed_when: true
  handlers:
    - name: Reiniciar portafolio
      ansible.builtin.command: docker compose up -d
      args: { chdir: "{{ app_dir }}" }
    - name: Recargar Nginx
      ansible.builtin.service: { name: nginx, state: reloaded }
