services:
  web:
    image: ${DOCKERHUB_USERNAME:-tu_usuario}/portfolio-ci-infra:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-portfolio_local_password}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_local_password}
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  portfolio_data: